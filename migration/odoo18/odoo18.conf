[options]
# Database Configuration
db_host = db
db_port = 5432
db_user = odoo18
db_password = odoo18_secure_password
db_name = odoo18
db_sslmode = prefer
db_maxconn = 64
db_template = template0

# Odoo 18 Server Configuration
admin_passwd = $pbkdf2-sha512$25000$admin_master_password_change_me
http_port = 8069
longpolling_port = 8072

# Addons Path
addons_path = /opt/odoo/odoo/addons,/opt/odoo/custom-addons/addons_custom,/opt/odoo/custom-addons/common

# Data Directory
data_dir = /opt/odoo/data

# Logging
logfile = /opt/odoo/logs/odoo18.log
log_level = info
log_handler = :INFO
log_db = False
log_db_level = warning

# Performance
workers = 4
max_cron_threads = 2
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200

# Security
list_db = True
proxy_mode = False

# Email Configuration (configure as needed)
# email_from = odoo18@example.com
# smtp_server = localhost
# smtp_port = 25
# smtp_ssl = False
# smtp_user = False
# smtp_password = False

# Session
session_timeout = 28800

# Debugging (disable in production)
# dev_mode = xml,reload
# test_enable = False
# test_file = False

# Multi-database
dbfilter = ^odoo18.*$

# Translation
# load_language = en_US
# translate_modules = all

# Unaccent (for better search)
unaccent = True

# Server Wide Modules
server_wide_modules = base,web

# Gevent mode (optional, for better concurrency)
# workers = 0
# max_cron_threads = 1
