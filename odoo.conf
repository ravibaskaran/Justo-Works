# Odoo 18 Configuration for Ubuntu ARM64 (OCI Ampere)
# Updated from Windows-based Odoo 15 setup
# Original Windows paths preserved in comments for reference

[options]
# ===== PATHS =====
# Linux paths (Odoo 18 on Ubuntu)
addons_path = /opt/odoo18/odoo18/addons,/opt/odoo18/addons_custom,/opt/odoo18/demo_addons_custom
data_dir = /opt/odoo18/.local/share/Odoo

# Original Windows paths (Odoo 15) - DEPRECATED:
# addons_path = C:\jworks\odoo15\addons,C:\jworks\odoo15\addons_custom,C:\jworks\odoo15\themes15,C:\jworks\odoo15\common,C:\jworks\odoo15\reports15,C:\jworks\odoo15\reports15/accounting,C:\jworks\odoo15\reports15/purchase,C:\jworks\odoo15\reports15/inventory,C:\jworks\odoo15\reports15/BASE,C:\jworks\odoo15\reports15/JUPITER,C:\jworks\odoo15\reports15/SALES
# data_dir = C:\jworks\justoworks_2025-07-04

# ===== SECURITY =====
# IMPORTANT: Change this password in production!
admin_passwd = CHANGE_THIS_TO_SECURE_PASSWORD_IN_PRODUCTION
proxy_mode = True
list_db = False

# ===== DATABASE =====
db_host = localhost
db_port = 5432
db_user = odoo18
db_password = CHANGE_THIS_DB_PASSWORD
;db_name =
;dbfilter = ^%d$

# ===== SERVER =====
http_port = 8069
;https_port = 8071
;longpolling_port = 8072

# ===== LOGGING =====
logfile = /var/log/odoo18/odoo.log
log_level = info
;log_db = True
;log_handler = :INFO

# ===== PERFORMANCE =====
# Adjust based on your server capacity
workers = 4
max_cron_threads = 2
limit_time_cpu = 600
limit_time_real = 1200
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
;limit_request = 8192

# ===== EMAIL =====
;email_from = False
;smtp_server = localhost
;smtp_port = 25
;smtp_ssl = False
;smtp_user = False
;smtp_password = False
